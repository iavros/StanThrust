name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows Installer
    runs-on: windows-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-packaging.txt

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Run tests
        run: python -m pytest -q

      - name: Build Windows installer
        run: python packaging\windows\build_installer.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: StanThrust-windows
          path: dist/installer/*

  macos:
    name: macOS DMG
    runs-on: macos-13
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-packaging.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build macOS DMG
        run: python packaging/macos/build_installer.py

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: StanThrust-macos
          path: dist/installer/*

  release:
    name: Publish Tagged Release
    runs-on: ubuntu-latest
    needs:
      - windows
      - macos
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "$TAG_NAME" --notes "StanThrust $TAG_NAME"
          gh release upload "$TAG_NAME" release-assets/* --clobber
