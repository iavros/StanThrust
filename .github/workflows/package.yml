name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - name: Run tests
        run: python -m pytest

      - name: Build Windows installer
        run: python packaging\windows\build_installer.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v5
        with:
          name: StanThrust-windows
          path: dist/installer/*

  macos:
    name: macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build macOS DMG
        run: python packaging/macos/build_installer.py

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v5
        with:
          name: StanThrust-macos
          path: dist/installer/*

  release:
    name: Publish Tagged Release
    runs-on: ubuntu-latest
    needs:
      - windows
      - macos
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Build release notes from the changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          {
            echo "Installers for Windows and macOS are attached below. The"
            echo "application can also update itself from Help > Check for Updates."
            echo
            echo "Supported runtimes for running from source: Python 3.11 to 3.13."
            echo
            awk -v v="$version" '
              $0 ~ "^## " v "( |$)" { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
          } > release-notes.md
          test -s release-notes.md || echo "StanThrust $TAG_NAME" > release-notes.md

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "StanThrust ${TAG_NAME#v}" --notes-file release-notes.md --latest
          else
            gh release create "$TAG_NAME" --title "StanThrust ${TAG_NAME#v}" --notes-file release-notes.md --latest
          fi
          gh release upload "$TAG_NAME" release-assets/* --clobber
